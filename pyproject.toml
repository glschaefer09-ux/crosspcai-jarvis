[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvas-crosspcai"
version = "1.0.0"
description = "JARVAS — the CrossPCAI control centre. One app, every machine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "CCD Enterprise and Development" }]

# The core runtime is stdlib-only on purpose: a frozen binary on five
# platforms must not depend on wheels being importable at runtime.
dependencies = []

[project.optional-dependencies]
# What turns the browser fallback into a real desktop app.
desktop = ["pywebview>=5.0", "pystray>=0.19", "pillow>=10.0"]
build = ["pyinstaller>=6.0", "pillow>=10.0"]

[project.scripts]
jarvas = "jarvas.__main__:main"

[project.gui-scripts]
# Windows: launches without a console window behind it.
jarvas-desktop = "jarvas.__main__:main"

[tool.setuptools]
packages = ["jarvas", "jarvas.connectors", "jarvas.services"]

[tool.setuptools.package-data]
jarvas = ["ui/*", "assets/*"]
